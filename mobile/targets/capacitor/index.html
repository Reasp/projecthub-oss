<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#18181b" />
    <link rel="icon" href="data:," />
    <!--
      Приложение не загружает код с ПК (п. 2.5.2 App Store Review Guidelines, decision-79 п. 10):
      скрипты только из пакета приложения, с хоста по сокету приходят данные.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src ws: wss:; object-src 'none'; base-uri 'none'"
    />
    <title>ProjectHub</title>
    <!--
      Launch Screen. Стоит в разметке, а не в React: виден с первого кадра WebView, до загрузки скриптов.
      Логотип — там же и того же размера (196 px), что у системного экрана Android (styles.xml), поэтому подмена
      не видна; дальше он поднимается и появляется название. Убирает экран mobile/src/app/launchScreen.ts, когда
      ответил ПК; если скрипт не запустился, экран гаснет сам через 8 с (l-giveup).
    -->
    <style>
      #launch {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        overflow: hidden;
        background: #0c1c31;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        -webkit-user-select: none;
        user-select: none;
        transition: opacity 0.38s ease;
        animation: l-giveup 0.4s ease 8s forwards;
      }
      #launch::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(60% 45% at 50% 44%, rgba(34, 74, 120, 0.55), transparent 70%),
          linear-gradient(180deg, #0c1c31 0%, #0a1729 60%, #081321 100%);
        opacity: 0;
        animation: l-fade 1.1s ease 0.1s forwards;
      }
      /* Заставка ждёт, пока уйдёт системный экран: класс l-go ставит MainActivity (запасной путь — launchScreen.ts). */
      #launch:not(.l-go) *,
      #launch:not(.l-go)::before {
        animation-play-state: paused !important;
      }
      #launch.l-out {
        opacity: 0;
        pointer-events: none;
      }
      #launch.l-out .l-stage {
        transform: scale(1.06);
      }
      .l-stage {
        position: absolute;
        inset: 0;
        transition: transform 0.38s ease;
      }
      /* Центр логотипа после подъёма: на 44 px выше центра экрана. */
      .l-logo,
      .l-glow,
      .l-orbit {
        position: absolute;
        left: 50%;
        top: 50%;
      }
      .l-logo {
        width: 196px;
        height: 196px;
        margin: -98px 0 0 -98px;
        animation: l-lift 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.12s forwards;
        will-change: transform;
      }
      .l-glow {
        width: 340px;
        height: 340px;
        margin: -214px 0 0 -170px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56, 220, 255, 0.28) 0%, rgba(139, 92, 246, 0.16) 38%, transparent 68%);
        opacity: 0;
        animation:
          l-fade 0.9s ease 0.35s forwards,
          l-breathe 2.6s ease-in-out 1.2s infinite;
      }
      .l-orbit {
        width: 260px;
        height: 260px;
        margin: -174px 0 0 -130px;
        opacity: 0;
        animation:
          l-fade 1s ease 0.6s forwards,
          l-spin 14s linear 0.6s infinite;
      }
      .l-orbit i {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #7dd3fc;
        box-shadow: 0 0 8px 2px rgba(103, 232, 249, 0.7);
        animation: l-twinkle 2.2s ease-in-out infinite;
      }
      .l-orbit i:nth-child(1) { left: 50%; top: 0; }
      .l-orbit i:nth-child(2) { left: 93%; top: 70%; background: #c4b5fd; box-shadow: 0 0 8px 2px rgba(167, 139, 250, 0.7); animation-delay: 0.7s; }
      .l-orbit i:nth-child(3) { left: 7%; top: 70%; animation-delay: 1.4s; }
      .l-orbit i:nth-child(4) { left: 15%; top: 18%; width: 3px; height: 3px; background: #c4b5fd; box-shadow: 0 0 6px 2px rgba(167, 139, 250, 0.6); animation-delay: 1s; }
      .l-title {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(50% + 62px);
        text-align: center;
        font-size: 30px;
        font-weight: 650;
        letter-spacing: 0.02em;
        color: #e6f1ff;
        opacity: 0;
        animation: l-title 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s forwards;
      }
      .l-title span {
        background: linear-gradient(90deg, #67e8f9, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .l-bar {
        position: absolute;
        left: 50%;
        top: calc(50% + 122px);
        width: 112px;
        height: 2px;
        margin-left: -56px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(148, 197, 255, 0.1);
        opacity: 0;
        animation: l-fade 0.5s ease 1s forwards;
      }
      .l-bar i {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #67e8f9, #a78bfa, transparent);
        animation: l-sweep 1.3s ease-in-out 1s infinite;
        transform: translateX(-100%);
      }
      @keyframes l-fade {
        to { opacity: 1; }
      }
      @keyframes l-giveup {
        to { opacity: 0; visibility: hidden; }
      }
      @keyframes l-lift {
        to { transform: translateY(-44px) scale(0.86); }
      }
      @keyframes l-breathe {
        0%, 100% { transform: scale(0.94); }
        50% { transform: scale(1.06); }
      }
      @keyframes l-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes l-twinkle {
        0%, 100% { opacity: 0.25; transform: scale(0.7); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes l-title {
        from { opacity: 0; transform: translateY(12px); letter-spacing: 0.24em; filter: blur(6px); }
        to { opacity: 1; transform: none; letter-spacing: 0.02em; filter: none; }
      }
      @keyframes l-sweep {
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #launch *,
        #launch::before {
          animation-duration: 1ms !important;
          animation-delay: 0s !important;
          animation-iteration-count: 1 !important;
        }
        .l-orbit,
        .l-bar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="launch" aria-hidden="true">
      <div class="l-stage">
        <div class="l-glow"></div>
        <div class="l-orbit"><i></i><i></i><i></i><i></i></div>
        <img class="l-logo" src="./launch-logo.webp" alt="" width="196" height="196" decoding="sync" />
        <div class="l-title">Project<span>Hub</span></div>
        <div class="l-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="../../src/entries/capacitor.tsx"></script>
  </body>
</html>
